name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed for the gh-pages publish step.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio allure-pytest

      - name: Run tests (Allure results)
        continue-on-error: true
        run: python -m pytest --alluredir=allure-results

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      - name: Install Allure Report 3
        if: always()
        run: npm install --no-save allure @allurereport/plugin-awesome

      - name: Get previous Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Restore Allure history
        if: always()
        run: |
          if [ -f gh-pages-prev/history/history.jsonl ]; then
            mkdir -p history
            cp gh-pages-prev/history/history.jsonl history/history.jsonl
          fi

      # Allure Report 3 (the `allure` npm package + awesome plugin). Pure Node,
      # no Java needed. Produces the modern "awesome" UI and a root summary.json.
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results

      - name: Bundle history into report
        if: always()
        run: |
          mkdir -p allure-report/history
          if [ -f history/history.jsonl ]; then
            cp history/history.jsonl allure-report/history/history.jsonl
          fi

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
